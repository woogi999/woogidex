<!-- ==================== battle-view ====================
     The battle simulator: teams, lobby and the battle screen

     Loaded into index.html by js/core/views.js the first time this page
     is opened. It is a fragment, not a document: no <html>, <head> or
     <body>, and the outer <div id="battle-view"> lives in index.html so the
     router can toggle it before this file has been fetched.

     Inline onclick handlers still work -- every module assigns its
     exports onto window, so the contract is unchanged by the move.
     ==================== -->
<!-- a page header like every other page, and the battle UI straight on the
     page (no card around it); #battle-body is filled by js/battle/ui/battle-ui.js -->
<div class="page-header battle-page-header">
    <div class="page-heading">
        <h1 class="page-title">Battle</h1>
        <p class="page-subtitle">Build a team from your Fakémon and battle other trainers.</p>
    </div>
    <div class="page-actions">
        <span id="battle-status" class="events-status battle-status"></span>
    </div>
</div>
<div id="battle-body" class="battle-body"></div>
