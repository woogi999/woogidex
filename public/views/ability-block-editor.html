<!-- ==================== ability-block-editor-view ====================
     The Scratch-style ability block whiteboard

     Loaded into index.html by js/core/views.js the first time this page
     is opened. It is a fragment, not a document: no <html>, <head> or
     <body>, and the outer <div id="ability-block-editor-view"> lives in index.html so the
     router can toggle it before this file has been fetched.

     Inline onclick handlers still work -- every module assigns its
     exports onto window, so the contract is unchanged by the move.
     ==================== -->
<div class="main-layout">
    <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap;">
            <h2 id="ability-block-editor-title" style="margin:0;">Code This Ability</h2>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary btn-sm" type="button" onclick="closeAbilityBlockEditor()"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back</button>
                <button class="btn btn-primary btn-sm" type="button" onclick="saveAbilityBlockEditor()">Save Ability Code</button>
            </div>
        </div>
        <p class="ability-block-intro">Very WIP. Code using coding blocks!
        </p>
        <div id="ability-block-trigger-row" class="ability-block-trigger-row"></div>
        <div class="ability-block-layout">
            <div class="ability-block-canvas" id="ability-block-canvas"></div>
            <div class="ability-block-preview">
                <div class="ability-block-preview-tabs">
                    <button type="button" class="ability-block-tab active" data-tab="sd" onclick="setAbilityBlockPreviewTab('sd')">Showdown</button>
                    <button type="button" class="ability-block-tab" data-tab="es" onclick="setAbilityBlockPreviewTab('es')">Essentials</button>
                </div>
                <pre class="ability-block-code" id="ability-block-code-sd"></pre>
                <pre class="ability-block-code" id="ability-block-code-es" style="display:none;"></pre>
            </div>
        </div>
    </div>
</div>
