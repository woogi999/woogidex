<!-- ==================== search-view ====================
     /search?q=... -- the full results for the header's search box (pressing
     Enter there lands here). Filled in by renderSearchPage() in
     js/features/global-search.js.
     ==================== -->
<div class="page-header">
    <div class="page-heading">
        <h1 class="page-title">Search</h1>
        <p class="page-subtitle" id="search-page-subtitle"></p>
    </div>
</div>

<form class="search-page-form" role="search" onsubmit="submitSearchPage(event)">
    <i data-lucide="search" aria-hidden="true"></i>
    <input type="search" id="search-page-input" placeholder="Search Woogidex" autocomplete="off" spellcheck="false" aria-label="Search Woogidex">
    <button class="btn btn-primary" type="submit">Search</button>
</form>

<div class="tabs search-page-tabs" id="search-page-tabs" role="tablist" aria-label="Filter results"></div>
<div class="search-page-results" id="search-page-results"></div>
